<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline | Wa-Kriti</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #faf7f0;
        color: #263826;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 380px; }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { color: #6b8a44; font-size: 14px; }
      button {
        margin-top: 20px;
        background: #3f5b3e;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
